<p>productlist works!</p>
<button type="button" (click)="getproduct()">api data</button>

<div class="container">
    <div class="row">

@for(card of productlistdata; track card.id)
{
        <div class="col-md-3 mt-3">
            <div class="card shadow">
                <img src="{{card.thumbnail}}" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">{{card.category}}</h5>
                    <p class="card-text">{{card.description}}</p>
                    <h3>Price : {{card.price}}</h3>
                    <a href="#" class="btn btn-primary">Go somewhere</a>
                </div>
            </div>
            </div>
        }

        
    </div>
</div>
